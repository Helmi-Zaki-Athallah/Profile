    <!-- Preload Background Audio for Instant Buffer -->
    <link rel="preload" href="/music.mp3" as="audio" type="audio/mpeg" />

    <!-- Instant Headless Background Audio Engine (Loads Before React) -->
    <script>
      (function() {
        if (window.__bgAudio) return;
        try {
          var audio = new Audio('/music.mp3');
          audio.loop = true;
          audio.volume = 0.7;
          audio.preload = 'auto';
          window.__bgAudio = audio;

          function startAudio() {
            if (!audio.paused) return;
            var p = audio.play();
            if (p !== undefined) {
              p.then(function() {
                cleanListeners();
              }).catch(function() {});
            }
          }

          var events = ['click', 'touchstart', 'touchend', 'pointerdown', 'pointerup', 'keydown', 'scroll', 'wheel'];
          function cleanListeners() {
            events.forEach(function(evt) {
              window.removeEventListener(evt, startAudio, true);
              document.removeEventListener(evt, startAudio, true);
            });
          }

          // Immediate play attempt
          startAudio();

          // Eager capture on any interaction to start audio with zero lag
          events.forEach(function(evt) {
            window.addEventListener(evt, startAudio, { capture: true, passive: true });
            document.addEventListener(evt, startAudio, { capture: true, passive: true });
          });
        } catch (e) {}
      })();
    </script>
